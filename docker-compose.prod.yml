# docker-compose.prod.yml — Production overrides for MemodoAI LibreChat
#
# Usage: ./prod.sh up -d
# Merge order: docker-compose.yml + docker-compose.override.yml + docker-compose.prod.yml
#
# This file overrides dev settings with production-appropriate configuration:
# - Release images pinned to specific versions (REQ-003, REQ-004, SEC-007)
# - Health checks for all services (REQ-027, PERF-001)
# - Resource limits (REQ-039)
# - Log rotation (REQ-015, PERF-004)
# - No exposed database ports (REQ-013, SEC-001)
# - MongoDB authentication (REQ-006, SEC-003)
# - Production logging and NODE_ENV (REQ-009, REQ-014)

services:
  api:
    # REQ-003: Release image pinned to specific version (not :latest)
    image: registry.librechat.ai/danny-avila/librechat:v0.8.5
    # SEC: container-user hardening (see ../platform/docs/runbooks/docker-user-hardening.md).
    # Pinned to 1000:1000 (non-root). Pinned LITERALLY (not "${UID}:${GID}") because
    # prod.sh exports the invoking shell's UID — run as root that forces 0:0 and the
    # .env.prod/UID lines in .env get overridden. The bind-mounts (uploads logs images)
    # AND the mounted ./.env.prod are chown'd to 1000:1000 on the host so the app can
    # read its config and write logs.
    # no-new-privileges blocks setuid escalation; cap_drop ALL removes all caps (binds
    # 3080 > 1024, needs none). NB: cap_drop ALL strips CAP_DAC_OVERRIDE, so even uid 0
    # would be subject to normal file perms — hence the ownership MUST match uid 1000.
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - MONGO_URI=${MONGO_URI}
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
      - RAG_PORT=${RAG_PORT:-8000}
      - RAG_API_URL=http://rag_api:${RAG_PORT:-8000}
    # REQ-027: Health check — /health on port 3080 (not /api/health).
    # The librechat image ships without curl, so use wget --spider (returns
    # non-zero on HTTP error) which is present in the image. Use 127.0.0.1
    # rather than localhost: busybox wget resolves localhost IPv6-first, and
    # the app only binds IPv4, so localhost yields "Connection refused".
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # REQ-039: Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    # REQ-015: Log rotation
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # !override REPLACES the volumes list from docker-compose.override.yml so
    # we can declare the prod set explicitly. Two groups below:
    #   1. prod-only mounts (.env, runtime data dirs)
    #   2. fork customization mounts — the five paths prod-sync.sh pushes from
    #      a developer machine. They overlay the upstream image's compiled
    #      packages and server source with the fork's build. Required paths
    #      must exist on the host before `./prod.sh up` (run prod-sync.sh
    #      first on a fresh deploy).
    #
    # KEEP THE FORK MOUNTS IN SYNC with docker-compose.override.yml — both
    # files list the same five paths. !override forces this duplication; if
    # you add/rename/remove a path in one file, mirror the change in the
    # other or dev and prod will diverge.
    volumes: !override
      - type: bind
        source: ./.env.prod
        target: /app/.env
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./images:/app/client/public/images
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - type: bind
        source: ./packages/api/dist
        target: /app/node_modules/@librechat/api/dist
      - type: bind
        source: ./packages/data-schemas/dist
        target: /app/node_modules/@librechat/data-schemas/dist
      - type: bind
        source: ./packages/data-provider/dist
        target: /app/node_modules/librechat-data-provider/dist
      - type: bind
        source: ./api/server
        target: /app/api/server
      - type: bind
        source: ./client/dist
        target: /app/client/dist
      # User-guide media bundle (tutorial video/transcript/chapters/PDF) served at
      # /guide-media. Not build output and not in git — the host ./guide-media dir
      # must be populated (copy from a dev machine) before `./prod.sh up`.
      # KEEP IN SYNC with docker-compose.override.yml.
      - ./guide-media:/app/guide-media

  mongodb:
    # REQ-006: MongoDB with authentication
    command: mongod --auth --bind_ip_all
    # SEC: pin to the mongo image's own uid:gid (999:999). The host ./data-node dir
    # is already owned by 999, so NO chown/migration is needed. Pinning a non-root
    # user means the entrypoint never has to drop privileges, which is what makes
    # cap_drop: ALL safe here. Overrides user: "${UID}:${GID}" (→ root) from base.
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # REQ-013: No exposed database ports (SEC-001)
    # Override the ports from base docker-compose.yml
    ports: !override []
    # First-startup user creation (greenfield deployments).
    # The official mongo image runs initdb exactly once, when /data/db is empty:
    #   1. MONGO_INITDB_ROOT_USERNAME/PASSWORD create the root user.
    #   2. Files in /docker-entrypoint-initdb.d/ run as that root user.
    #      mongo-init/init-librechat-user.sh creates the LibreChat app user.
    # On subsequent restarts, /data/db is non-empty and initdb is skipped.
    volumes:
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    # REQ-027: Health check with auth credentials
    healthcheck:
      test: >-
        mongosh --quiet
        --username "$${MONGO_ADMIN_USER}"
        --password "$${MONGO_ADMIN_PASSWORD}"
        --authenticationDatabase admin
        --eval "db.adminCommand('ping').ok"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      # Drives the official mongo image's first-startup root-user creation.
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ADMIN_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ADMIN_PASSWORD}
      # Used by the init script to create the application user.
      - LIBRECHAT_MONGO_USER=${LIBRECHAT_MONGO_USER}
      - LIBRECHAT_MONGO_PASSWORD=${LIBRECHAT_MONGO_PASSWORD}
      # Used by the healthcheck above. Same values as MONGO_INITDB_ROOT_*.
      - MONGO_ADMIN_USER=${MONGO_ADMIN_USER}
      - MONGO_ADMIN_PASSWORD=${MONGO_ADMIN_PASSWORD}
    # REQ-039: Resource limits
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "1.0"
        reservations:
          memory: 1G
    # REQ-015: Log rotation
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  meilisearch:
    # SEC: non-root. ./meili_data_v1.35.1 was chown'd to 1000:1000 on the host, so a
    # pinned user + cap_drop ALL is safe (entrypoint never drops privileges).
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # REQ-027: Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # REQ-039: Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    # REQ-015: Log rotation
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  vectordb:
    # SEC: pin to postgres' own uid:gid (999:999). The pgdata2 volume is already
    # owned by 999:999, so no migration is needed and the entrypoint never drops
    # privileges → cap_drop: ALL is safe.
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # REQ-007: Strong credentials from .env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # REQ-027: Health check
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # REQ-039: Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    # REQ-015: Log rotation
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rag_api:
    # REQ-004: Pinned RAG API image version
    # Note: No non-dev release image available as of 2026-04-01.
    # Pinned dev-lite to specific version tag. Accepted technical debt — revisit
    # when a release image becomes available.
    image: registry.librechat.ai/danny-avila/librechat-rag-api-dev-lite:v0.5.0
    # SEC: stateless API (no persistent volume), binds 8000 > 1024 → needs no caps.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - DB_HOST=vectordb
      - RAG_PORT=${RAG_PORT:-8000}
    # !override replaces (not merges) env_file from docker-compose.yml. Without it,
    # Compose v2 concatenates lists: [.env, .env.prod] → fails on prod where .env doesn't exist.
    env_file: !override
      - .env.prod
    # REQ-027: Health check
    # The rag-api-dev-lite image is python-slim and ships without curl/wget,
    # so use python's stdlib urllib instead. urlopen raises on non-2xx, which
    # produces a non-zero exit and Docker reports unhealthy.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:${RAG_PORT:-8000}/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # REQ-039: Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    # REQ-015: Log rotation
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    # REQ-008: Pinned MinIO image version (not :latest)
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    # SEC: non-root. ./minio-data was chown'd to 1000:1000 on the host, so a pinned
    # user + cap_drop ALL is safe (entrypoint never drops privileges).
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: https://minio.memodo-eng.de
    # REQ-027: Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # REQ-039: Resource limits
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    # REQ-015: Log rotation
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio-init:
    # REQ-008: Pinned mc image version
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  # SPEC-014 REQ-001/005/011/018/026/031, OPS-001/002, REL-003 — M365 MCP sidecar.
  # BYOT trust boundary: no env-resident credentials. The LibreChat API injects
  # a per-request Authorization header on every tools/call.
  # KEEP IN SYNC with the mcp-m365 service in docker-compose.override.yml.
  mcp-m365:
    build:
      context: ./mcp-m365
      args:
        # Resolved 2026-05-19 via `npm view @softeria/ms-365-mcp-server@latest version`.
        SOFTERIA_VERSION: "0.110.0"
        # Resolved 2026-05-19 via `sha256sum` over the `npm pack` tarball.
        SOFTERIA_SHA256: "38e495a29e7357f6777af6bf643c71ee9fd662fcd0aeec754c966ad8ea76ad8e"
    container_name: mcp-m365
    hostname: mcp-m365
    restart: unless-stopped
    networks:
      - default
      - caddy_net
    expose:
      - "3000"
    healthcheck:
      # See docker-compose.override.yml mcp-m365.healthcheck for rationale.
      # 401 added 2026-05-19 after deploy revealed Softeria 0.110.0 returns
      # 401 (auth-first) on unauthenticated GET to /mcp.
      test:
        - CMD-SHELL
        - |
          nc -z localhost 3000 && \
          wget --server-response --spider \
            --tries=1 --timeout=5 \
            http://localhost:3000/mcp 2>&1 | \
            grep -qE 'HTTP/.+ (200|400|401|403|405|406)'
      retries: 5
      interval: 10s
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.1'
      restart_policy:
        condition: on-failure
        max_attempts: 5
        window: 5m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    read_only: true
    tmpfs: !override
      # Scratch for the busybox `wget --spider` healthcheck probe.
      - /tmp:size=10m,mode=1777
      # Softeria 0.110.0 writes file logs to ${HOME}/.ms-365-mcp-server/logs
      # at boot. Under read_only: true, /root is immutable, so we mount a
      # tmpfs at the exact path Softeria needs.
      - /root/.ms-365-mcp-server:size=100m,mode=0755
    security_opt: !override
      - no-new-privileges:true
    cap_drop: !override
      - ALL

  # SPEC-016: Conversation log sidecar — analytical store for MemodoAI.
  # conv-log is always built from source (first-party sidecar; no pre-built image).
  # Prod deploy: git pull + ./prod.sh up -d conv-log  (no prod-sync.sh needed).
  conv-log:
    build:
      context: ./conv-log
    container_name: conv-log
    restart: unless-stopped
    # !override: prod env file only (dev .env must not leak into prod)
    env_file: !override
      - .env.prod
    depends_on:
      mongodb:
        condition: service_started
      vectordb:
        condition: service_started
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp
    security_opt: !override
      - no-new-privileges:true
    cap_drop: !override
      - ALL
    user: convlog
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # REQ-051: node_exporter for host-level Prometheus metrics
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter
    restart: unless-stopped
    # SEC: no-new-privileges. cap_drop ALL is intentionally omitted — node-exporter
    # uses pid: host and read-only host mounts (/proc /sys /) to gather metrics;
    # already runs as `nobody`, so this is a low-risk, deliberately minimal change.
    security_opt:
      - no-new-privileges:true
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"
    # NB: consume the full body (-O /dev/null) rather than --spider. --spider closes
    # the connection after headers, so node-exporter logs a burst of "broken pipe"
    # errors mid metric-family write on every probe. A full GET avoids that noise.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

networks:
  caddy_net:
    external: true
