version: 1.3.6

cache: true

# Restrict registration to company email domains (REQ-011).
# Combined with ALLOW_UNVERIFIED_EMAIL_LOGIN=false (REQ-012), only verified company
# emails can register. Add additional domains here if needed.
registration:
  allowedDomains:
    - "memodo.de"
    - "memodo-eng.de"
    - "memodo.at"
    - "memodo.cz"
    - "memodo.it"
    - "memodo.nl"
  socialLogins:
    - openid

interface:
  customWelcome: 'Welcome to MemodoAI'
  fileSearch: true
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts:
    use: true
    create: true
    share: true
    public: false
  bookmarks: true
  multiConvo: false
  agents:
    use: true
    create: true
    share: true
    public: false
  remoteAgents:
    use: false
    create: false
    share: false
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  fileCitations: true
  defaultPinnedTools:
    - 'web_search'
    - 'file_search'

fileConfig:
  endpoints:
    azureOpenAI:
      fileLimit: 5
      fileSizeLimit: 20
      supportedMimeTypes:
        - "image/.*"
        - "application/pdf"
        - "text/.*"
        - "application/vnd.openxmlformats-officedocument.*"

rateLimits:
  fileUploads:
    ipMax: 100
    ipWindowInMinutes: 60
    userMax: 50
    userWindowInMinutes: 60
  conversationsImport:
    ipMax: 100
    ipWindowInMinutes: 60
    userMax: 50
    userWindowInMinutes: 60

transactions:
  enabled: true

# Token balance for per-user cost control (REQ-037).
# startBalance: initial tokens for new users (~10 conversations).
# autoRefill: monthly top-up. To raise dev allowance without losing prod cost
# control, an admin can manually top up specific accounts via the admin panel.
balance:
  enabled: false
  startBalance: 20000
  autoRefillEnabled: true
  refillIntervalValue: 30
  refillIntervalUnit: 'days'
  refillAmount: 10000

# Agent Actions domain restrictions
# When AI agents use "actions" (tool integrations that call external APIs via OpenAPI specs),
# this whitelist controls which domains those API calls can reach.
# By default, SSRF targets are blocked (localhost, private IPs, .internal/.local TLDs).
# Add domains here as you create agents that need to call external APIs.
# Supports wildcards: '*.example.com' and protocol/port: 'https://api.example.com:8443'
actions:
  allowedDomains:
      - 'api.open-meteo.com'

# MCP Server domain restrictions for remote transports (SSE, WebSocket, HTTP)
# Controls which domains MCP servers can connect to when using remote protocols.
# By default, SSRF targets are blocked (localhost, private IPs, .internal/.local TLDs).
# To allow internal targets like host.docker.internal, add them here.
# Supports wildcards: '*.example.com' and protocol/port: 'https://api.example.com:8443'
mcpSettings:
  allowedDomains:
    - 'docs.mcp.cloudflare.com'
    # SPEC-014 REQ-005 / REQ-011: M365 MCP sidecar is reachable on the
    # internal docker network via its container hostname. Listing it here
    # opts the streamable-http transport out of the default SSRF block on
    # non-public targets.
    - 'mcp-m365'

# MCP Servers - Define Model Context Protocol servers that provide tools to agents.
# Supports stdio (local command) and SSE (remote URL) transports.
# Each server exposes tools that agents can use during conversations.
#
# SPEC-014 deployment note (2026-05-19): the Microsoft365 entry below is the
# intended SPEC-014 §REQ-004 configuration. The infrastructure (sidecar +
# BYOT-via-OBO plumbing + queue + JWT-invariant validation + error envelope)
# is deployed and verified on prod. The agent surface, however, is NOT yet
# working because of upstream LibreChat v0.8.5 limitations discovered during
# deployment debug 2026-05-19:
#
#  1. yaml-sourced MCP servers (this entry, `source: yaml` in admin DB) do
#     NOT persist their discovered tool-function definitions. `getMCPTools`
#     returns empty at agent-runtime; the agent's tools array stays at 0.
#  2. UI-sourced MCP servers (added via admin MCP panel, `source: user`)
#     persist toolFunctions correctly BUT the admin UI does not support the
#     `{{LIBRECHAT_GRAPH_ACCESS_TOKEN}}` placeholder header pattern (only
#     None / API Key / OAuth auth modes). API-Key with the placeholder gets
#     encrypted at rest and substitution is uncertain.
#  3. UI-source rename does not propagate to discovered tool-function keys
#     (keys retain `_mcp_temp_server_name` suffix even after the server is
#     saved with the intended name).
#
# Net: SPEC-014 deployment is "infrastructure complete; agent surface gated
# on upstream LibreChat investigation". See SDD/research/RESEARCH-015 for
# the follow-up workstream tracking the upstream limitations.
mcpServers:
  # SPEC-014 / RESEARCH-015 — M365 (Outlook, Calendar, OneDrive, Excel, OneNote,
  # To Do, Planner, Contacts, Graph search) via the Softeria sidecar.
  #
  # Auth: LibreChat-native On-Behalf-Of (OBO). The `obo.scopes` below are
  # exchanged per signed-in user (Entra SSO) for a Microsoft Graph token, which
  # LibreChat resolves at connect time and injects into the MCP connection.
  # The sidecar stores no credentials (BYOT trust boundary preserved — see
  # SDD/adr/0001). This replaces the prior hand-rolled BYOT placeholder
  # (`{{LIBRECHAT_GRAPH_ACCESS_TOKEN}}`) + MCPCallQueue path, which was retired
  # once the v0.8.7 native OBO path (obo config + CONFIGURE_OBO trust gate)
  # fixed the v0.8.5 MCP-to-agent bridge limitation tracked in RESEARCH-015.
  Microsoft365:
    type: streamable-http
    url: http://mcp-m365:3000/mcp
    # Outer MCP request budget — keep below the frontend's request budget.
    timeout: 45000
    # Cold-start absorbing budget for first-connect tool registration.
    initTimeout: 150000
    # Lazy connect: Softeria requires the Authorization header on every
    # JSON-RPC call (including `initialize`), so the OBO token must be present
    # before connecting. The connection is deferred to the first user-scoped
    # tool call, when the user's Graph token can be resolved via OBO.
    startup: false
    obo:
      scopes: "User.Read Mail.Read Calendars.Read Files.Read.All Sites.Read.All Contacts.Read Tasks.Read Notes.Read.All"
    serverInstructions: >
      Use these tools to interact with the signed-in user's Microsoft 365 data:
      Outlook mail, Calendar, OneDrive (files), SharePoint (read-only: sites,
      drives, lists, and list items), Excel, OneNote, To Do, Planner, Contacts,
      and Graph search. Operate strictly on behalf of the current user.
      All tools are read-only in phase 1; do not attempt writes (send, create,
      update, delete) — they will fail at the Graph API. Teams is not available
      in phase 1.
      Do NOT search SharePoint, OneDrive, or Mail without a user-named target
      (site, folder, sender, keyword, date range). If the user asks an
      open-ended question, ask a clarifying question first; do not enumerate to
      find candidates.
      NEVER set fetchAllPages: true on any tool — it is broken with this
      server's output format and silently returns only the first page. To read
      more rows, request one bounded page (e.g. top: 50) with a $select of only
      the fields you need, and if more are needed, page explicitly by following
      the @odata.nextLink from the previous response.
      When querying SharePoint list items, do NOT use $filter with contains() or
      on non-indexed columns such as Title (Graph rejects these with a 400);
      instead match or refine locally, or use the site and Graph search tools.
      When the user asks to list or browse their own OneDrive files (a
      user-named target), do NOT call search-onedrive-files with a wildcard,
      empty, or single-letter q — Graph rejects q="*" with a 400 ("potentially
      dangerous Request.Path"). Instead list the drive directly: call list-drives
      for the drive id, then get-drive-root-item for that drive's root folder id,
      then list-folder-files with that drive id and root id to list the root's
      children (page via @odata.nextLink as above); descend into a child folder's
      id only when the user asks. Reserve search-onedrive-files for a concrete
      term the user actually named.
      (v6, 2026-07 — add UX-002 non-enumeration guardrail; OneDrive list steering)

# Web Search - Enables agents to search the web and scrape content.
webSearch:
  searchProvider: serper
  scraperProvider: serper
  serperApiKey: '${SERPER_API_KEY}'

# File storage via MinIO (S3-compatible)
fileStrategy: "s3"

endpoints:
  agents:
    recursionLimit: 25
    maxRecursionLimit: 100
    disableBuilder: false
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.25
    titleModel: "gpt-5-mini"
    titleEndpoint: "azureOpenAI"
    capabilities: ["file_search", "web_search", "actions", "artifacts", "tools"]
  azureOpenAI:
    titleModel: "gpt-5-mini"
    plugins: true
    titleConvo: true
    summarize: true
    summaryModel: "gpt-5-mini"
    groups:
      - group: "sweden-central"
        apiKey: "${AZURE_OPENAI_API_KEY_SWEDEN}"
        instanceName: "memodo-openai-sweden"
        version: "2025-04-01-preview"
        models:
          gpt-5:
            deploymentName: "gpt-5"
          gpt-5-mini:
            deploymentName: "gpt-5-mini"

  # custom:
  #   # Research Agent - Multi-stage news analysis pipeline
  #   - name: "TA Research Agent"
  #     apiKey: "${RESEARCH_AGENT_API_KEY}"
  #     baseURL: "http://ta-agent-api:8000/v1"
  #     models:
  #       default: ["TA Research Agent v1"]
  #       fetch: false
  #     titleConvo: true
  #     titleEndpoint: "together.ai"
  #     titleModel: "meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo"
  #     summarize: true
  #     summaryModel: "meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo"
  #     streamRate: 25
  #     modelDisplayLabel: "TA Research Agent v1"

# Memory - Allows the AI to remember user preferences and context across conversations.
# Requires a memory agent configured with a provider and model.
memory:
  disabled: false
  personalize: true
  tokenLimit: 10000
  agent:
    provider: "azureOpenAI"
    model: "gpt-5-mini"
    instructions: "You are a memory management assistant. Store and manage user information accurately."
    model_parameters:
      temperature: 0.1

modelSpecs:
  enforce: false
  addedEndpoints:
    - "custom"
    - "agents"
  list:
    - name: "gpt-5"
      label: "GPT-5"
      description: "GPT-5 with document upload support"
      group: "MemodoAI"
      groupIcon: "azureOpenAI"
      preset:
        endpoint: "azureOpenAI"
        model: "gpt-5"
        # Disabled 2026-05-19 (SPEC-014 deploy debug): with useResponsesApi: true,
        # GPT-5 was producing polite text-only responses to MCP-tool prompts
        # without ever emitting tool_calls (silent hang). Suspected cause is the
        # Responses API tool-format adapter in LibreChat / @librechat/agents not
        # passing MCP tools through correctly. Flip back to true if Chat
        # Completions API has its own issues OR if Responses-API features
        # (reasoning effort, structured output) are needed.
        useResponsesApi: true
