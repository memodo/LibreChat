version: 1.3.6

cache: true

interface:
  customWelcome: 'Welcome to MemodoAI'
  fileSearch: true
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts:
    use: true
    create: true
    share: true
    public: false
  bookmarks: true
  multiConvo: true
  agents:
    use: true
    create: true
    share: true
    public: false
  peoplePicker:
    users: true
    groups: true
    roles: true
  marketplace:
    use: false
  fileCitations: true

fileConfig:
  endpoints:
    azureOpenAI:
      fileLimit: 5
      fileSizeLimit: 20
      supportedMimeTypes:
        - "image/.*"

rateLimits:
  fileUploads:
    ipMax: 100
    ipWindowInMinutes: 60
    userMax: 50
    userWindowInMinutes: 60
  conversationsImport:
    ipMax: 100
    ipWindowInMinutes: 60
    userMax: 50
    userWindowInMinutes: 60

transactions:
  enabled: true

balance:
  enabled: false
  startBalance: 20000
  autoRefillEnabled: false
  refillIntervalValue: 30
  refillIntervalUnit: 'days'
  refillAmount: 10000

# Agent Actions domain restrictions
# When AI agents use "actions" (tool integrations that call external APIs via OpenAPI specs),
# this whitelist controls which domains those API calls can reach.
# By default, SSRF targets are blocked (localhost, private IPs, .internal/.local TLDs).
# Add domains here as you create agents that need to call external APIs.
# Supports wildcards: '*.example.com' and protocol/port: 'https://api.example.com:8443'
actions:
  allowedDomains: []

# MCP Server domain restrictions for remote transports (SSE, WebSocket, HTTP)
# Controls which domains MCP servers can connect to when using remote protocols.
# By default, SSRF targets are blocked (localhost, private IPs, .internal/.local TLDs).
# To allow internal targets like host.docker.internal, add them here.
# Supports wildcards: '*.example.com' and protocol/port: 'https://api.example.com:8443'
mcpSettings:
  allowedDomains: []

# MCP Servers - Define Model Context Protocol servers that provide tools to agents.
# Supports stdio (local command) and SSE (remote URL) transports.
# Each server exposes tools that agents can use during conversations.
# mcpServers:
#   # SSE example (remote server):
#   everything:
#     url: http://localhost:3001/sse
#     timeout: 60000
#   # Stdio example (local command):
#   filesystem:
#     command: npx
#     args:
#       - -y
#       - "@modelcontextprotocol/server-filesystem"
#       - /path/to/directory
#     timeout: 300000

# Web Search - Enables agents to search the web and scrape content.
# Requires API keys for the providers you want to use.
# webSearch:
#   # Reranking (improves result quality):
#   jinaApiKey: '${JINA_API_KEY}'
#   cohereApiKey: '${COHERE_API_KEY}'
#   # Search providers (at least one needed):
#   serperApiKey: '${SERPER_API_KEY}'
#   searxngInstanceUrl: '${SEARXNG_INSTANCE_URL}'
#   searxngApiKey: '${SEARXNG_API_KEY}'
#   # Content scrapers (for fetching full page content):
#   firecrawlApiKey: '${FIRECRAWL_API_KEY}'
#   firecrawlApiUrl: '${FIRECRAWL_API_URL}'

# File storage via MinIO (S3-compatible)
fileStrategy: "s3"

endpoints:
  agents:
    recursionLimit: 25
    maxRecursionLimit: 100
    disableBuilder: false
    maxCitations: 30
    maxCitationsPerFile: 7
    minRelevanceScore: 0.45
    capabilities: ["deferred_tools", "execute_code", "file_search", "actions", "tools"]
  # Azure OpenAI - Configure once you have your Azure details.
  # Required .env variables: AZURE_OPENAI_API_KEY, AZURE_OPENAI_API_INSTANCE_NAME, AZURE_OPENAI_API_VERSION
  # See: https://www.librechat.ai/docs/configuration/azure
  # azureOpenAI:
  #   titleModel: "gpt-4o-mini"  # Use your deployment name for titles
  #   plugins: true
  #   groups:
  #     - group: "my-azure-group"
  #       apiKey: "${AZURE_OPENAI_API_KEY}"
  #       instanceName: "${AZURE_OPENAI_API_INSTANCE_NAME}"  # Your Azure resource name
  #       version: "${AZURE_OPENAI_API_VERSION}"              # e.g. "2024-06-01"
  #       models:
  #         gpt-4o:
  #           deploymentName: "gpt-4o"          # Your Azure deployment name
  #         gpt-4o-mini:
  #           deploymentName: "gpt-4o-mini"     # Your Azure deployment name

  custom:
    # Research Agent - Multi-stage news analysis pipeline
    - name: "TA Research Agent"
      apiKey: "${RESEARCH_AGENT_API_KEY}"
      baseURL: "http://ta-agent-api:8000/v1"
      models:
        default: ["TA Research Agent v1"]
        fetch: false
      titleConvo: true
      titleEndpoint: "together.ai"
      titleModel: "meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo"
      summarize: true
      summaryModel: "meta-llama/Meta-Llama-3.1-8B-Instruct-Turbo"
      streamRate: 25
      modelDisplayLabel: "TA Research Agent v1"

# Memory - Allows the AI to remember user preferences and context across conversations.
# Requires a memory agent configured with a provider and model.
# Uncomment and configure once Azure OpenAI is set up.
# memory:
#   disabled: false
#   personalize: true
#   tokenLimit: 10000
#   agent:
#     provider: "azureOpenAI"
#     model: "gpt-4o-mini"                # Use your Azure deployment name
#     instructions: "You are a memory management assistant. Store and manage user information accurately."
#     model_parameters:
#       temperature: 0.1
