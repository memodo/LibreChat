# monitoring/alertmanager/alertmanager.yml — Alertmanager configuration (REQ-032)
#
# Routes Prometheus alerts to notification targets (email, webhook).
# Configure at least one receiver before production deployment.
#
# Webhook receiver works with Slack, Microsoft Teams, or any HTTP endpoint.
# Email receiver requires an SMTP server (e.g., relay via Caddy host or external SMTP).

global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h

receivers:
  # Webhook URL is read from a file mounted at /etc/alertmanager/secrets/.
  # The file is gitignored — create it on each host with the Power Automate
  # workflow URL (no trailing newline: use `printf` or `echo -n`).
  - name: default
    msteamsv2_configs:
      - webhook_url_file: /etc/alertmanager/secrets/teams-webhook-url
        send_resolved: true

  - name: critical
    msteamsv2_configs:
      - webhook_url_file: /etc/alertmanager/secrets/teams-webhook-url
        send_resolved: true

# To use email instead of/in addition to webhook:
# receivers:
#   - name: default
#     email_configs:
#       - to: 'admin@memodo.de'
#         from: 'alertmanager@memodo-eng.de'
#         smarthost: 'smtp.example.com:587'
#         auth_username: 'alertmanager@memodo-eng.de'
#         auth_password: '<smtp-password>'
#         require_tls: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
