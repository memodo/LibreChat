# monitoring/grafana/provisioning/dashboards/dashboards.yml
#
# Tells Grafana where to find dashboard JSON files. Loaded from
# /etc/grafana/provisioning/dashboards via the bind-mount in
# monitoring/docker-compose.monitoring.yml.
#
# allowUiUpdates: true lets operators tweak dashboards in the UI for
# incident triage; the JSON on disk remains the source of truth on restart.

apiVersion: 1

providers:
  - name: memodo-dashboards
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/main
      foldersFromFilesStructure: false

  # REQ-016 / SPEC-017: conv-log dashboards use a separate provider entry scoped
  # to the convlog/ subfolder with allowUiUpdates: false so provisioned JSON is
  # the source of truth — a live UI edit that adds a forbidden-default column
  # (text/content/feedback_text/title/raw) cannot silently persist.
  #
  # The two providers MUST scan disjoint directories. The file provider always
  # recurses into subdirectories (foldersFromFilesStructure only controls folder
  # mapping, NOT recursion), so a parent path here would re-claim the convlog
  # dashboards' UIDs from convlog-dashboards. Grafana reacts to a UID owned by
  # two providers by revoking DB write permission from BOTH, which silently
  # blocks all provisioning updates. Hence memodo-dashboards is scoped to main/
  # and convlog-dashboards to convlog/ — no overlap, no duplicate UIDs.
  - name: convlog-dashboards
    orgId: 1
    folder: Conv-Log
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /etc/grafana/provisioning/dashboards/convlog
