# monitoring/docker-compose.monitoring.yml — Prometheus + Grafana stack (REQ-028)
#
# Deployed on the same server as the application (acknowledged SPOF — RISK-005).
# External uptime monitoring (REQ-031) provides independent alerting.
#
# Usage: ./prod-mon.sh up -d
# (wraps `docker compose -f monitoring/docker-compose.monitoring.yml --env-file .env.prod`)
#
# Prerequisites:
#   - node-exporter running (deployed via docker-compose.prod.yml)
#   - Application services running
#   - caddy_net external network exists
#   - librechat_default external network exists (created by the main compose stack)
#
# Network topology:
#   - monitoring: internal network for Prometheus <-> exporters
#   - caddy_net: external network for Grafana web access via Caddy
#   - librechat_default: external network shared with the application stack,
#     allows exporters to reach database containers (mongodb, vectordb, etc.)

services:
  # REQ-032: Alertmanager for alert notification delivery
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: alertmanager
    restart: unless-stopped
    # SEC: runs as non-root (nobody) already; add runtime hardening. HTTP-only, no caps.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    # Bind to localhost only — not exposed externally
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: prometheus
    restart: unless-stopped
    # SEC: runs as non-root (nobody) already; add runtime hardening. HTTP-only, no caps.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      # Bind the directory rather than individual files. Single-file bind mounts
      # latch onto the inode at container-start, so a later `git pull` that
      # atomically replaces the file (new inode) leaves the container reading
      # the orphaned original. Directory mounts re-resolve entries on access,
      # so the container always sees the current file. After editing, trigger
      # a config reload: `curl -X POST http://127.0.0.1:9090/-/reload`.
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    # Bind to localhost only — accessible from host for watchdog checks
    # but not exposed externally (REQ-027-A)
    ports:
      - "127.0.0.1:9090:9090"
    # REQ-027-A: Health check for monitoring infrastructure
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - alertmanager
    networks:
      - monitoring
      - caddy_net
      - librechat_default
      - redakt_default

  grafana:
    image: grafana/grafana:11.5.2
    container_name: grafana
    restart: unless-stopped
    # SEC: runs as uid 472 already; add runtime hardening. HTTP-only, no caps.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # GRAFANA_ADMIN_PASSWORD must be set in .env.prod (see .env.prod.template)
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD not set — add to .env.prod}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=https://grafana.memodo-eng.de
      # REQ-003 / SPEC-017: password for the convlog_reader Postgres role used by the
      # convlog-postgres datasource. MUST equal CONVLOG_PG_READER_PASSWORD (the secret
      # inside CONVLOG_PG_READ_URI). Rotation must update all three locations atomically.
      - GRAFANA_CONVLOG_DB_PASSWORD=${GRAFANA_CONVLOG_DB_PASSWORD:?GRAFANA_CONVLOG_DB_PASSWORD must be set — must equal convlog_reader password (CONVLOG_PG_READER_PASSWORD)}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    # Bind to localhost only — Caddy proxies external access via caddy_net
    ports:
      - "127.0.0.1:3000:3000"
    # REQ-027-A: Health check
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - prometheus
    networks:
      - monitoring
      - caddy_net
      - librechat_default

  # REQ-029: LibreChat exporter for application-level Prometheus metrics
  # Note: No tagged releases available for librechat_exporter as of 2026-04-01.
  # Pinned to :latest — accepted tech debt, same pattern as REQ-004.
  # Revisit when tagged releases are published at ghcr.io/virtuos/librechat_exporter.
  librechat-exporter:
    image: ghcr.io/virtuos/librechat_exporter:latest
    container_name: librechat-exporter
    restart: unless-stopped
    # SEC: stateless metrics scraper (no volumes), binds 8000 > 1024 → no caps needed.
    # Image runs as root; cap_drop ALL + no-new-privileges still meaningfully reduce it.
    # Non-root user not pinned (unverified image) — candidate follow-up.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - MONGODB_URI=${MONGO_URI:-mongodb://mongodb:27017/LibreChat}
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring
      - librechat_default

  # REQ-030: MongoDB exporter for database metrics
  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter
    restart: unless-stopped
    # SEC: runs as non-root already; stateless scraper, no caps needed.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - MONGODB_URI=${MONGO_EXPORTER_URI:-mongodb://mongodb:27017}
    command:
      - '--mongodb.uri=${MONGO_EXPORTER_URI:-mongodb://mongodb:27017}'
      - '--discovering-mode'
      - '--compatible-mode'
      # Without this, only the diagnosticData and replicaSetStatus collectors run,
      # which on a standalone mongo emit just `mongodb_up`. --collect-all enables
      # dbstats, indexstats, topmetrics, currentopmetrics, collstats — the bulk
      # of useful series (connections, opcounters, memory, network, asserts).
      - '--collect-all'
    expose:
      - "9216"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring
      - librechat_default

  # REQ-030: PostgreSQL exporter for database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: postgres-exporter
    restart: unless-stopped
    # SEC: runs as non-root (nobody) already; stateless scraper, no caps needed.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      # Credentials must be set in .env.prod — no insecure defaults
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:?POSTGRES_USER not set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD not set}@vectordb:5432/${POSTGRES_DB:?POSTGRES_DB not set}?sslmode=disable
    expose:
      - "9187"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring
      - librechat_default

  # cAdvisor for container-level metrics (ContainerMemoryHigh alert).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    # SEC: hardened collector. Runs as root (owns the :ro host paths it reads, so
    # owner-DAC works without CAP_DAC_OVERRIDE) → cap_drop ALL is safe. no-new-privileges.
    # The /var/run mount (which exposed docker.sock = a container→host-root escape path)
    # was REMOVED: verified the cgroup CPU/mem series are identical without it (52 vs 53),
    # and docker name-label resolution was already non-functional here (overlay2 layerdb).
    # cgroup stats come from /sys; container metadata from /var/lib/docker (ro).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    expose:
      - "8080"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - monitoring

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  monitoring:
    driver: bridge
  caddy_net:
    external: true
  # The application stack's default network — allows exporters to reach
  # database containers (mongodb, vectordb) running in the main compose stack.
  # This network is created automatically by the main docker compose stack.
  # The name depends on the project directory name; adjust if different.
  librechat_default:
    external: true
    name: ${COMPOSE_PROJECT_NETWORK:-librechat-worktree_default}
  # Redakt PII API runs in a separate compose stack on its own default network.
  # Prometheus joins it to scrape redakt-api:8000/health.
  redakt_default:
    external: true
    name: ${REDAKT_PROJECT_NETWORK:-redakt_default}
