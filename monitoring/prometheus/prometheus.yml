# monitoring/prometheus/prometheus.yml — Prometheus configuration (REQ-029, REQ-030)
#
# Scrape targets for all MemodoAI services and exporters.
# Alert rules are in alerts.yml.

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

# Alertmanager configuration (REQ-032)
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # REQ-051: Host-level metrics via node_exporter
  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  # REQ-029: LibreChat application metrics
  - job_name: "librechat"
    static_configs:
      - targets: ["librechat-exporter:8000"]
    scrape_interval: 60s

  # REQ-030: MongoDB metrics
  - job_name: "mongodb"
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  # REQ-030: PostgreSQL metrics
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Container-level metrics via cAdvisor (ContainerMemoryHigh alert)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # SPEC-016 REQ-067: Conversation log sidecar metrics
  - job_name: "conv-log"
    static_configs:
      - targets: ["conv-log:9300"]
