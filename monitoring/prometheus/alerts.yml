# monitoring/prometheus/alerts.yml — Alert rules (REQ-032)
#
# Critical alert conditions for MemodoAI production deployment.
# Notification routing is configured via Alertmanager (not included in this file).

groups:
  - name: service_health
    rules:
      # Service down for >2 minutes
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been unreachable for >2 minutes."

      # MinIO down — file uploads/attachments fail while it is unreachable.
      - alert: MinIODown
        expr: probe_success{job="minio-blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MinIO object storage is down"
          description: "Liveness probe of {{ $labels.instance }} has failed for >2 minutes. File uploads and attachment retrieval are failing."

      # MongoDB restart loop — >3 restarts in 10 minutes
      - alert: MongoDBRestartLoop
        expr: changes(mongodb_up[10m]) > 3
        labels:
          severity: critical
        annotations:
          summary: "MongoDB restart loop detected"
          description: "MongoDB has restarted >3 times in the last 10 minutes. Check logs: docker compose logs mongodb"

  - name: resource_alerts
    rules:
      # Disk usage >80% (warning)
      - alert: DiskSpaceWarning
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage >80%"
          description: "Root filesystem is {{ $value | printf \"%.1f\" }}% full."

      # Disk usage >90% (critical)
      - alert: DiskSpaceCritical
        expr: (1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage >90%"
          description: "Root filesystem is {{ $value | printf \"%.1f\" }}% full. Immediate action required."

      # Container memory >85% of limit.
      # id filter restricts to Docker containers — without it the alert spams
      # on systemd service cgroups (atd, rsyslog, etc.) since cAdvisor on this
      # host doesn't enrich metrics with the `name` label.
      # The `> 0` filter on the denominator drops containers without a memory
      # limit set (cAdvisor reports limit=0 for those, which would otherwise
      # produce +Inf% and fire spuriously).
      - alert: ContainerMemoryHigh
        expr: container_memory_usage_bytes{id=~"/system.slice/docker-.*"} / (container_spec_memory_limit_bytes{id=~"/system.slice/docker-.*"} > 0) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container memory >85%"
          description: "Container {{ $labels.id }} is using {{ $value | printf \"%.1f\" }}% of its memory limit."

      # Host memory usage >90%
      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage >90%"
          description: "Host memory is {{ $value | printf \"%.1f\" }}% used."

  - name: application_alerts
    rules:
      # API 5xx rate >5% over 5 minutes
      # Note: requires librechat_exporter to expose HTTP metrics
      - alert: HighErrorRate
        expr: rate(librechat_http_requests_total{status=~"5.."}[5m]) / rate(librechat_http_requests_total[5m]) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate >5%"
          description: "API is returning {{ $value | printf \"%.1f\" }}% 5xx errors over the last 5 minutes."

      # Admin reporting abuse — >60 calls/min (REQ-042 rate limit)
      - alert: AdminReportingAbuse
        expr: rate(librechat_http_requests_total{handler=~"/api/admin/usage.*"}[1m]) * 60 > 60
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Admin reporting endpoint abuse detected"
          description: "Admin usage endpoints receiving >60 requests/minute."

  - name: pii_alerts
    rules:
      # PII circuit breaker open
      - alert: PIICircuitBreakerOpen
        expr: librechat_pii_circuit_breaker_state == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "PII detection circuit breaker is OPEN"
          description: "Redakt API is unavailable. Messages are passing through unscanned (fail-open mode). Check Redakt container."

      # Direct, traffic-independent Redakt liveness via blackbox_exporter.
      # PIICircuitBreakerOpen above only fires after live chat traffic hits a
      # dead Redakt 5x — on a quiet/just-rebooted system it stays silent.
      # This probe is what catches the "Redakt didn't come back after reboot"
      # incident class. The generic ServiceDown (up == 0) only covers the
      # exporter itself being unreachable, not the probe target — keep both.
      - alert: RedaktDown
        expr: probe_success{job="redakt-blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Redakt PII API is down"
          description: "Liveness probe of {{ $labels.instance }} has failed for >2 minutes. PII detection is unavailable; chat traffic will fail open unscanned. Check the redakt compose stack: docker compose -f /opt/docker/redakt/docker-compose.yml ps"

      # Redakt up but degraded — a Presidio sub-service (analyzer/anonymizer)
      # is down, so /api/health reports "degraded" instead of "healthy".
      - alert: RedaktDegraded
        expr: probe_success{job="redakt-readiness"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redakt PII API is degraded"
          description: "Readiness probe of {{ $labels.instance }} reports non-healthy for >5 minutes. A Presidio sub-service is likely down. Check: docker compose -f /opt/docker/redakt/docker-compose.yml ps"

      # High PII block rate — >50 events/hour
      - alert: HighPIIBlockRate
        expr: increase(librechat_pii_events_total{action="block"}[1h]) > 50
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "High PII block rate (>50 events/hour)"
          description: "{{ $value }} PII events in the last hour. Review for false positives."

  - name: backup_alerts
    rules:
      # REQ-025 / REQ-032: Backup failure detection via textfile collector
      # Backup scripts write a timestamp to /var/lib/node_exporter/textfile/backup_*.prom
      # node-exporter scrapes these via --collector.textfile.directory.
      # Alert if the last successful backup is older than expected.
      #
      # To enable: add --collector.textfile.directory=/host/textfile to node-exporter
      # and mount the textfile directory. Backup scripts write:
      #   echo "backup_last_success_timestamp{type=\"mongodb\"} $(date +%s)" > /path/backup_mongodb.prom
      - alert: BackupStale
        expr: time() - backup_last_success_timestamp > 90000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backup for {{ $labels.type }} is stale"
          description: "Last successful {{ $labels.type }} backup was {{ $value | humanizeDuration }} ago (threshold: 25h)."

  - name: conv_log_alerts
    rules:
      # SPEC-016 REQ-068: Conversation log sidecar sync lag breach.
      #
      # Threshold formula (REQ-068):
      #   max(10 * CONVLOG_INTERVAL_SECONDS, CONVLOG_ALERT_MIN_LAG_SECONDS)
      #
      # Prometheus cannot read sidecar env vars at evaluation time, so the
      # threshold is baked in as a literal. Current baked-in defaults:
      #   CONVLOG_INTERVAL_SECONDS  = 300  →  10 × 300  = 3000s
      #   CONVLOG_ALERT_MIN_LAG_SECONDS = 900           →  floor = 900s
      #   effective threshold                           = 3000s (max of above)
      #
      # ┌──────────────────────────────────────────────────────────────────┐
      # │  OPERATOR ACTION REQUIRED when tuning either env var:           │
      # │                                                                  │
      # │  If you change CONVLOG_INTERVAL_SECONDS from 300:               │
      # │    1. Recalculate: max(10 × NEW_VALUE, CONVLOG_ALERT_MIN_LAG_S) │
      # │    2. Edit the literal `3000` in the expr line below to the     │
      # │       new threshold.                                             │
      # │    3. Update the humanized "3000s" in the description annotation│
      # │       below to match.                                           │
      # │                                                                  │
      # │  If you change CONVLOG_ALERT_MIN_LAG_SECONDS from 900:          │
      # │    Recalculate the max() and update `3000` as above if it       │
      # │    becomes the new floor.                                        │
      # │                                                                  │
      # │  This file does NOT auto-update — manual edit is mandatory.     │
      # └──────────────────────────────────────────────────────────────────┘
      - alert: ConvLogSyncLagBreach
        expr: >
          (convlog_sync_lag_seconds > scalar(vector(3000)))
            and on() (convlog_pending_messages > 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "conv-log sync lag exceeds threshold with pending messages"
          description: >
            convlog_sync_lag_seconds is {{ $value | humanizeDuration }} (threshold: 3000s /
            max(10 * CONVLOG_INTERVAL_SECONDS, CONVLOG_ALERT_MIN_LAG_SECONDS)).
            The AND-gate on convlog_pending_messages > 0 suppresses false positives during
            idle periods when no new messages exist. Runbook: conv-log/README.md.

      # CRI-09: bisection structural failure — dead-letter rows from non-upsert phases
      # indicate a systemic schema mismatch (e.g., all rows in a fleet upgrade batch
      # fail with the same constraint violation). Alert if any non-postgres_upsert phase
      # sees dead-letter activity over a 10-minute window for 5 minutes.
      - alert: ConvLogDeadLetterStructuralFailure
        expr: rate(convlog_dead_letter_total{phase!="postgres_upsert"}[10m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "conv-log dead-letter structural failure phase={{ $labels.phase }}"
          description: >
            Dead-letter rows are being written with phase={{ $labels.phase }}, which indicates
            a structural failure mode (bisection overflow, normalisation skips, etc.) rather than
            a single bad row. Investigate the sidecar logs for repeated errors on this phase.
            Runbook: conv-log/README.md#recognising-runaway-erasure.

      # CRI-04: runaway erasure alert — high erasure deletion rate may indicate a
      # Mongo connectivity blip that bypassed the safety check, or legitimate bulk erasure.
      - alert: ConvLogErasureRunaway
        expr: rate(convlog_erasure_deletions_total[5m]) > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "conv-log erasure deletion rate is abnormally high"
          description: >
            convlog_erasure_deletions_total is increasing at >100 rows/second over 10 minutes.
            Check convlog_errors_total{phase='erasure_safety_abort'} — if it is also increasing,
            the safety check fired but the issue is ongoing. If erasure_safety_abort is 0, this
            may be a legitimate bulk erasure from a GDPR right-to-erasure event.
            Runbook: conv-log/README.md#recognising-runaway-erasure.

  - name: tls_alerts
    rules:
      # TLS certificate expiry <14 days
      # Fed by the blackbox-tls job (blackbox_exporter http_tls module) probing
      # the public HTTPS routes. probe_ssl_earliest_cert_expiry is emitted on
      # every TLS handshake regardless of the HTTP status behind basic auth.
      - alert: TLSCertExpirySoon
        expr: probe_ssl_earliest_cert_expiry{job="blackbox-tls"} - time() < 14 * 24 * 3600
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires in <14 days"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."
