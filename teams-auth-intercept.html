<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MemodoAI – Authenticated</title>
  <script src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js"></script>
</head>
<body>
  <script>
    // Immediately delete the trigger cookie so subsequent direct
    // visits to / are not intercepted by Caddy again.
    document.cookie = 'teams_auth_popup=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/; Secure';

    // Signal Teams that auth is complete — this resolves the
    // successCallback in teams-auth-start.html and closes the popup.
    microsoftTeams.app.initialize()
      .then(() => microsoftTeams.authentication.notifySuccess('authenticated'))
      .catch(() => {
        // Fallback: not in a Teams popup — go to main app directly
        window.location.href = '/';
      });
  </script>
</body>
</html>
