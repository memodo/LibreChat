services:
  api:
    # --- Local test of the merged feature-upgrade-15-06-26 branch ---
    # The pinned v0.8.6 release image (docker-compose.yml) predates the tsdown
    # toolchain: it expects @librechat/api `dist/index.js`, but this branch ships
    # `dist/index.cjs` + 221 commits of new deps, so overlaying dist on it
    # crash-loops. Build a self-contained image from the merged source (Node 24)
    # instead; the dist/server bind-mounts below then overlay identical content.
    # Revert: delete this build+image block to fall back to the release image.
    build:
      context: .
      dockerfile: Dockerfile
    image: librechat:merge-test
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    # Fork customization mounts — overlay the upstream image with our build.
    # KEEP IN SYNC with the matching block in docker-compose.prod.yml. Prod
    # uses `volumes: !override` so it has to re-list these explicitly; if you
    # add/rename/remove a path here, mirror the change there.
    volumes:
    - type: bind
      source: ./librechat.yaml
      target: /app/librechat.yaml
    - type: bind
      source: ./packages/api/dist
      target: /app/node_modules/@librechat/api/dist
    - type: bind
      source: ./packages/data-schemas/dist
      target: /app/node_modules/@librechat/data-schemas/dist
    - type: bind
      source: ./packages/data-provider/dist
      target: /app/node_modules/librechat-data-provider/dist
    - type: bind
      source: ./api/server
      target: /app/api/server
    - type: bind
      source: ./client/dist
      target: /app/client/dist
    # User-guide media bundle (tutorial video/transcript/chapters/PDF) served at
    # /guide-media. Not build output and not in git — the host ./guide-media dir
    # must be populated before `up`. KEEP IN SYNC with docker-compose.prod.yml.
    - ./guide-media:/app/guide-media
    networks:
      - default
      - caddy_net
    # NOTE: this depends_on block REPLACES the [mongodb, rag_api] list from
    # base docker-compose.yml (Compose does not merge list-form with map-form).
    # All baseline dependencies must be re-listed here.
    depends_on:
      mongodb:
        condition: service_started
      rag_api:
        condition: service_started
      minio:
        condition: service_started
      mcp-m365:
        # SPEC-014 REQ-018: service_started (NOT service_healthy) — the 90s
        # start_period + initTimeout in librechat.yaml absorbs cold start; we
        # don't want the API to block on the sidecar's healthcheck.
        condition: service_started

  # SPEC-014 REQ-001/005/011/018/026/031, OPS-001/002, REL-003 — M365 MCP sidecar.
  # BYOT trust boundary: no env-resident credentials. The LibreChat API injects
  # a per-request Authorization header on every tools/call.
  mcp-m365:
    build:
      context: ./mcp-m365
      args:
        # Mirror values from ./mcp-m365/Dockerfile and ./mcp-m365/VERSION.
        # Resolved 2026-05-19 via `npm view @softeria/ms-365-mcp-server@latest version`.
        SOFTERIA_VERSION: "0.110.0"
        # Resolved 2026-05-19 via `sha256sum` over the `npm pack` tarball.
        SOFTERIA_SHA256: "38e495a29e7357f6777af6bf643c71ee9fd662fcd0aeec754c966ad8ea76ad8e"
    container_name: mcp-m365
    hostname: mcp-m365
    restart: unless-stopped
    networks:
      - default
      - caddy_net
    expose:
      - "3000"
    healthcheck:
      # REQ-018: status-tolerant probe. Softeria's /mcp is POST-only JSON-RPC
      # with auth required, so a bare GET --spider yields 4xx — we accept
      # 200/400/401/403/405/406 as proof-of-life (any HTTP response from
      # Softeria proves the process is alive and bound; 5xx and connection
      # failures correctly fail). 401 added 2026-05-19 after deploy showed
      # Softeria 0.110.0 returns 401 (auth-first) on unauthenticated GET.
      test:
        - CMD-SHELL
        - |
          nc -z localhost 3000 && \
          wget --server-response --spider \
            --tries=1 --timeout=5 \
            http://localhost:3000/mcp 2>&1 | \
            grep -qE 'HTTP/.+ (200|400|401|403|405|406)'
      retries: 5
      interval: 10s
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'
        reservations:
          memory: 128m
          cpus: '0.1'
      restart_policy:
        condition: on-failure
        max_attempts: 5
        window: 5m
    read_only: true
    tmpfs:
      # Scratch for the busybox `wget --spider` healthcheck probe.
      - /tmp:size=10m,mode=1777
      # Softeria 0.110.0 writes file logs to ${HOME}/.ms-365-mcp-server/logs
      # at boot (logger.js mkdirSync). Under read_only: true, /root is
      # immutable, so we mount a small tmpfs at the exact path Softeria
      # needs. Sized for ~24h of moderate log volume; rotation TBD if growth
      # surfaces in observability.
      - /root/.ms-365-mcp-server:size=100m,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BROWSER_REDIRECT_URL: https://minio.memodo-eng.de
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - default
      - caddy_net

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/librechat --ignore-existing;
      exit 0;
      "
    networks:
      - default

  # SPEC-016: Conversation log sidecar — analytical store for MemodoAI.
  # Reads Mongo read-only; writes to convlog Postgres DB on vectordb host.
  # No host port published; Prometheus scrapes :9300 on default network.
  conv-log:
    build:
      context: ./conv-log
    restart: unless-stopped
    env_file: .env
    depends_on:
      mongodb:
        condition: service_started
      vectordb:
        condition: service_started
    networks:
      - default
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: convlog

networks:
  caddy_net:
    external: true
